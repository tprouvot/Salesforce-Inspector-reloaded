name: Playwright Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ releaseCandidate, beta, main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    # Cache node_modules to speed up the process
    - name: Restore node_modules cache
      id: cache-npm
      uses: actions/cache@v5
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Setup Salesforce CLI and authenticate
      if: ${{ vars.SF_TEST_MOCKENABLED == 'false' }}
      env:
        SF_CLI_URL: ${{ vars.SF_CLI_URL }}
        SF_API_VERSION: ${{ vars.SF_API_VERSION }}
        SF_TEST_MOCKENABLED: ${{ vars.SF_TEST_MOCKENABLED }}
        SF_TEST_ACCOUNTID: ${{ vars.SF_TEST_ACCOUNT_RECORD_ID }}
        SF_TEST_FLOWID: ${{ vars.SF_TEST_FLOW_ID }}
        SF_TEST_FLOWDEFID: ${{ vars.SF_TEST_FLOW_DEF_ID }}
        SF_AUTH_URL: ${{ secrets.SF_AUTH_URL }}
      run: |
        # Install Salesforce CLI
        echo "Installing Salesforce CLI from $SF_CLI_URL"
        wget $SF_CLI_URL -O sf-cli.tar.xz
        mkdir -p sf-cli
        tar xJf sf-cli.tar.xz -C sf-cli --strip-components=1
        echo "$PWD/sf-cli/bin" >> $GITHUB_PATH
        export PATH="$PWD/sf-cli/bin:$PATH"
        sf --version
        
        # Authenticate and get access token
        echo "Authenticating to Salesforce org using SF_AUTH_URL..."
        echo $SF_AUTH_URL > ./SFDX_AUTH_URL.txt
        sf org login sfdx-url -f ./SFDX_AUTH_URL.txt -a cicdorg -d

        # Display the authenticated org and extract the access token and instance url
        echo "Extracting authentication information..."
        sf org display --json -o cicdorg
        echo "Continue to the next step..."
        
        # Run command and capture both output and exit code
        # Specify the org alias to ensure we get the right org info
        ORG_INFO=$(sf org display --json -o cicdorg 2>/dev/null)
        SF_EXIT_CODE=$?
        
        if [ $SF_EXIT_CODE -ne 0 ]; then
          echo "Error: sf org display failed with exit code $SF_EXIT_CODE"
          # Try again without suppressing stderr to see the error
          sf org display --json -o cicdorg
          exit 1
        fi
        
        # Check if we got valid JSON
        if [ -z "$ORG_INFO" ]; then
          echo "Error: sf org display returned empty output"
          exit 1
        fi
        
        # Debug: Show first 500 chars of output
        echo "DEBUG: First 500 chars of ORG_INFO:"
        echo "$ORG_INFO" | head -c 500
        echo ""
        
        # Validate JSON and extract values
        if ! echo "$ORG_INFO" | jq empty 2>/dev/null; then
          echo "Error: Invalid JSON returned from sf org display"
          echo "Full output: $ORG_INFO"
          exit 1
        fi
        
        # Check if the command returned an error status
        JSON_STATUS=$(echo "$ORG_INFO" | jq -r '.status // empty' 2>/dev/null)
        if [ -n "$JSON_STATUS" ] && [ "$JSON_STATUS" != "0" ]; then
          echo "Error: sf org display returned error status: $JSON_STATUS"
          echo "Error message:"
          echo "$ORG_INFO" | jq -r '.message // .message[] // empty' 2>/dev/null
          echo "Full JSON:"
          echo "$ORG_INFO" | jq '.' 2>/dev/null
          exit 1
        fi
        
        # Debug: Show JSON structure
        echo "DEBUG: JSON structure:"
        echo "$ORG_INFO" | jq '.' 2>/dev/null || echo "$ORG_INFO"
        
        ACCESS_TOKEN=$(echo "$ORG_INFO" | jq -r '.result.accessToken // empty' 2>/dev/null)
        INSTANCE_URL=$(echo "$ORG_INFO" | jq -r '.result.instanceUrl // empty' 2>/dev/null)
        
        echo "DEBUG: ACCESS_TOKEN extracted: ${ACCESS_TOKEN:0:20}..."
        echo "DEBUG: INSTANCE_URL: $INSTANCE_URL"
        
        if [ -z "$ACCESS_TOKEN" ]; then
          echo "Error: Could not extract access_token from auth response"
          echo "Available JSON keys:"
          echo "$ORG_INFO" | jq 'keys' 2>/dev/null || echo "Could not parse JSON"
          echo "Result keys (if exists):"
          echo "$ORG_INFO" | jq '.result | keys' 2>/dev/null || echo "No result object"
          exit 1
        fi
        
        # Extract hostname from instance URL
        if [ -n "$INSTANCE_URL" ]; then
          SF_HOST=$(echo "$INSTANCE_URL" | sed 's|https\?://||' | sed 's|/.*||')
        else
          echo "Error: Could not determine Salesforce instance URL"
          exit 1
        fi
        
        if [ -z "$SF_HOST" ]; then
          echo "Error: Could not determine Salesforce hostname"
          exit 1
        fi
        
        echo "Successfully authenticated. Host: $SF_HOST"
        echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
        echo "SF_HOST=$SF_HOST" >> $GITHUB_ENV
        
        # Update test-helpers.js with real credentials
        echo "Updating test-helpers.js with real credentials..."
        # Use perl for more robust string replacement (perl handles special chars better than sed)
        perl -i -pe "s/mockHost: \".*\"/mockHost: \"\Q$SF_HOST\E\"/" tests/e2e/test-helpers.js
        perl -i -pe "s/mockToken: \".*\"/mockToken: \"\Q$ACCESS_TOKEN\E\"/" tests/e2e/test-helpers.js
        perl -i -pe "s/accountRecordId: \".*\"/accountRecordId: \"\Q$SF_TEST_ACCOUNTID\E\"/" tests/e2e/test-helpers.js
        perl -i -pe "s/flowId: \".*\"/flowId: \"\Q$SF_TEST_FLOWID\E\"/" tests/e2e/test-helpers.js
        perl -i -pe "s/flowDefId: \".*\"/flowDefId: \"\Q$SF_TEST_FLOWDEFID\E\"/" tests/e2e/test-helpers.js
        perl -i -pe "s/apiVersion: \".*\"/apiVersion: \"\Q$SF_API_VERSION\E\"/" tests/e2e/test-helpers.js
        perl -i -pe "s/mockEnabled: \".*\"/mockEnabled: \"\Q$SF_TEST_MOCKENABLED\E\"/" tests/e2e/test-helpers.js
        
        # Display the updated test-helpers.js file to verify replacements
        echo "=== Updated test-helpers.js (first 15 lines) ==="
        head -n 15 tests/e2e/test-helpers.js

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      run: npm run test:e2e

