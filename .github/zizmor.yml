rules:
  # Actions are referenced by tag and kept current by Dependabot. Pinning every
  # `uses:` to a commit SHA is a repository-wide policy decision, not a defect.
  unpinned-uses:
    ignore:
      - ci.yml
      - e2e.yml
      - mega-linter.yml
  # The caches here are populated by pull_request runs that carry no secrets and
  # publish nothing, so a poisoned entry cannot reach a privileged context.
  cache-poisoning:
    ignore:
      - ci.yml
      - e2e.yml
      - mega-linter.yml
  # MegaLinter needs persisted credentials to push its own auto-fix commit back
  # onto the feature branch (APPLY_FIXES_MODE: commit).
  artipacked:
    ignore:
      - mega-linter.yml
      - ci.yml
